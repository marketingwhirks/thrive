<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/auth.js"></script>
<title>Clients - Thrive</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg-primary: #0f1419;
    --bg-secondary: #1a1f2e;
    --bg-card: rgba(255,255,255,0.04);
    --border: rgba(34,197,94,0.2);
    --text-primary: #e0e0e0;
    --text-secondary: #a0a0a0;
    --text-muted: #666;
    --accent: #22c55e;
    --accent-dim: rgba(34,197,94,0.15);
    --green: #22c55e;
    --red: #ff6b6b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* Nav */
  nav {
    display:flex; align-items:center; gap:16px;
    padding:12px 24px;
    background:rgba(15,20,25,0.9);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(12px);
    position:sticky; top:0; z-index:100;
  }
  .nav-brand {
    display:flex; align-items:center; gap:10px;
    text-decoration:none; color:#fff;
  }
  .nav-logo {
    width:32px; height:32px;
    background:linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-logo svg { width:18px; height:18px; }
  .nav-title { font-size:18px; font-weight:700; }
  .nav-links { display:flex; gap:4px; margin-left:24px; }
  .nav-link {
    padding:6px 14px; border-radius:6px;
    font-size:13px; font-weight:500;
    color:var(--text-secondary); text-decoration:none;
    transition:all 0.15s;
  }
  .nav-link:hover, .nav-link.active {
    background:var(--accent-dim);
    color:#fff;
  }

  /* Main */
  .container { max-width:1400px; margin:0 auto; padding:24px; }

  .page-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:24px;
  }
  .page-header h1 { font-size:24px; font-weight:700; }

  /* Placeholder */
  .placeholder-card {
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:60px 20px;
    text-align:center;
  }
  .placeholder-card svg { width:64px; height:64px; color:var(--text-muted); margin-bottom:16px; opacity:0.4; }
  .placeholder-card h2 { font-size:18px; font-weight:600; margin-bottom:8px; }
  .placeholder-card p { font-size:14px; color:var(--text-muted); line-height:1.6; max-width:480px; margin:0 auto; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <div class="nav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="nav-title">Thrive</span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="/">Overview</a>
    <a class="nav-link active" href="/clients.html">Clients</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>Client Financials</h1>
  </div>

  <div class="placeholder-card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="18" rx="2"/>
      <path d="M2 8h20"/>
      <path d="M8 3v5"/>
      <path d="M16 3v5"/>
      <path d="M7 13h3"/>
      <path d="M7 17h3"/>
      <path d="M14 13h3"/>
      <path d="M14 17h3"/>
    </svg>
    <h2>Coming Soon</h2>
    <p>
      Client financial data will be integrated here with P&L summaries,
      balance sheet snapshots, trend analysis, and firm-wide benchmarks.
      Your team's existing financial data from QBO will power these views.
    </p>
  </div>
</div>

</body>
</html>
