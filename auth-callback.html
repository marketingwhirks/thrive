<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating...</title>
  <style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .loader{text-align:center}.spinner{width:40px;height:40px;border:3px solid #eee;border-top:3px solid #333;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Signing in...</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const error = params.get('error');
    if (token) {
      localStorage.setItem('ms_session_token', token);
      window.location.href = '/';
    } else if (error) {
      document.querySelector('p').textContent = 'Sign-in failed: ' + error;
    }
  </script>
</body>
</html>
