<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in...</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background:#0d1117;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#e0e0e0;
  }
  .status { text-align:center; }
  .spinner {
    width:40px; height:40px;
    border:3px solid rgba(34,197,94,0.2);
    border-top-color:#22c55e;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 16px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .msg { font-size:16px; color:#aaa; }
</style>
</head>
<body>
<div class="status">
  <div class="spinner"></div>
  <div class="msg" id="msg">Completing sign-in...</div>
</div>

<script>
  var AUTH_BASE = "https://standing-malamute-183.convex.site";
  var params = new URLSearchParams(window.location.search);
  var token = params.get("token");
  var redirect = params.get("redirect") || "/";

  if (token) {
    localStorage.setItem("thrive_session_token", token);
    // Verify and get user info
    fetch(AUTH_BASE + "/auth/verify-ms", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.valid && data.user) {
        localStorage.setItem("thrive_user", JSON.stringify(data.user));
        window.location.href = redirect;
      } else {
        document.getElementById("msg").textContent = "Session invalid. Redirecting to login...";
        localStorage.removeItem("thrive_session_token");
        setTimeout(function() { window.location.href = "/login.html"; }, 1500);
      }
    })
    .catch(function() {
      // Token stored, redirect anyway
      window.location.href = redirect;
    });
  } else {
    document.getElementById("msg").textContent = "No token received. Redirecting to login...";
    setTimeout(function() { window.location.href = "/login.html"; }, 1500);
  }
</script>
</body>
</html>
