<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Thrive</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background:#0d1117;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#e0e0e0;
  }
  .login-card {
    background:rgba(26,31,46,0.95);
    border:1px solid rgba(74,144,226,0.2);
    border-radius:16px;
    padding:48px 40px;
    text-align:center;
    max-width:420px;
    width:90%;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
  }
  .logo-mark {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:64px;
    height:64px;
    background:linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    border-radius:16px;
    margin-bottom:16px;
  }
  .logo-mark svg { width:36px; height:36px; }
  .brand-name {
    font-size:28px;
    font-weight:800;
    color:#fff;
    letter-spacing:-0.5px;
    margin-bottom:4px;
  }
  .brand-tagline {
    font-size:13px;
    color:#22c55e;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .subtitle {
    font-size:14px;
    color:#888;
    margin-bottom:36px;
  }
  .ms-btn {
    display:inline-flex;
    align-items:center;
    gap:12px;
    background:#2f2f2f;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:14px 32px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    transition:all 0.2s;
  }
  .ms-btn:hover {
    background:#404040;
    transform:translateY(-1px);
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .ms-btn svg { width:22px; height:22px; }
  .error-msg {
    background:rgba(255,59,48,0.15);
    border:1px solid rgba(255,59,48,0.3);
    color:#ff6b6b;
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:24px;
    font-size:13px;
    display:none;
  }
  .footer {
    margin-top:32px;
    font-size:12px;
    color:#555;
  }
  .footer a {
    color:#4a90e2;
    text-decoration:none;
  }
  .divider {
    display:flex;
    align-items:center;
    gap:12px;
    margin:24px 0;
    color:#555;
    font-size:12px;
  }
  .divider::before, .divider::after {
    content:'';
    flex:1;
    height:1px;
    background:rgba(255,255,255,0.1);
  }
  .purpose-text {
    font-size:12px;
    color:#666;
    font-style:italic;
    line-height:1.5;
    margin-top:24px;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
  </div>
  <div class="brand-name">Thrive</div>
  <div class="brand-tagline">Patrick Accounting</div>
  <div class="subtitle">Client Financial Insights</div>

  <div class="error-msg" id="errorMsg"></div>

  <a class="ms-btn" id="msBtn" href="#">
    <svg viewBox="0 0 23 23" fill="none">
      <rect width="11" height="11" fill="#F25022"/>
      <rect x="12" width="11" height="11" fill="#7FBA00"/>
      <rect y="12" width="11" height="11" fill="#00A4EF"/>
      <rect x="12" y="12" width="11" height="11" fill="#FFB900"/>
    </svg>
    Sign in with Microsoft
  </a>

  <div class="footer">
    Restricted to @patrickaccounting.com and @whirks.com accounts
  </div>

  <div class="purpose-text">
    We give business owners the opportunity to Thrive<br>
    by simplifying their financial and people complexities.
  </div>
</div>

<script>
  var AUTH_BASE = "https://standing-malamute-183.convex.site";

  // Check for error in URL
  var params = new URLSearchParams(window.location.search);
  var error = params.get("error");
  if (error) {
    var errorEl = document.getElementById("errorMsg");
    var messages = {
      "unauthorized_domain": "Your email domain is not authorized. Only @patrickaccounting.com and @whirks.com accounts can sign in.",
      "no_email": "Could not retrieve your email from Microsoft. Please try again.",
      "token_exchange_failed": "Authentication failed. Please try again.",
      "access_denied": "You denied the sign-in request.",
      "no_code": "No authorization code received. Please try again.",
    };
    errorEl.textContent = messages[error] || "Sign-in failed: " + error;
    errorEl.style.display = "block";
  }

  // If already authenticated, redirect
  var token = localStorage.getItem("thrive_session_token");
  if (token) {
    fetch(AUTH_BASE + "/auth/verify-ms", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.valid) {
        window.location.href = params.get("redirect") || "/";
      }
    })
    .catch(function() {});
  }

  // Set up Microsoft button
  var redirect = params.get("redirect") || "/";
  var msUrl = AUTH_BASE + "/auth/microsoft?redirect=" + encodeURIComponent("https://thrive.patrickaccounting.com" + redirect);
  document.getElementById("msBtn").href = msUrl;
</script>
</body>
</html>
